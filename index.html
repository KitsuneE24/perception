<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perception</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/turn.min.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/book-intro.css">
  <link rel="stylesheet" href="css/flipbook.css">
  <link rel="stylesheet" href="css/finale.css">
  <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
  
  <!-- ======================================================
  3D BOOK INTRO
  ====================================================== -->
  <div id="scene">

    <div id="book-intro" title="Cliquer pour ouvrir">
      <ul class="bk-hardcover-front">
        <li>
          <!-- double border frame -->
          <div class="cv-frame-inner"></div>
          <!-- content -->
          <!-- diamond portrait frame -->
          <div class="cv-portrait-wrap">
            <div class="cv-diam-gem cv-gem-top">◆</div>
            <div class="cv-diam-gem cv-gem-right">◆</div>
            <div class="cv-diam-gem cv-gem-bottom">◆</div>
            <div class="cv-diam-gem cv-gem-left">◆</div>
            <div class="cv-diamond">
              <div class="cv-diamond-face">
                <svg viewBox="0 0 52 52" width="38" height="38" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 26 Q26 8 48 26 Q26 44 4 26 Z" fill="rgba(107,45,139,0.5)" stroke="rgba(212,169,106,0.85)" stroke-width="1.4" stroke-linecap="round"/>
                  <path d="M12 22 Q26 14 40 22" fill="none" stroke="rgba(212,169,106,0.28)" stroke-width="0.7"/>
                  <circle cx="26" cy="26" r="10" fill="rgba(212,169,106,0.08)" stroke="rgba(212,169,106,0.7)" stroke-width="1.2"/>
                  <path d="M26 16 C29 20 29 23 26 26 C23 23 23 20 26 16" fill="rgba(212,169,106,0.14)" stroke="rgba(212,169,106,0.42)" stroke-width="0.7"/>
                  <path d="M26 36 C29 32 29 29 26 26 C23 29 23 32 26 36" fill="rgba(212,169,106,0.14)" stroke="rgba(212,169,106,0.42)" stroke-width="0.7"/>
                  <circle cx="26" cy="26" r="4.5" fill="rgba(107,45,139,0.92)" stroke="rgba(212,169,106,0.5)" stroke-width="0.8"/>
                  <circle cx="30" cy="22" r="2.5" fill="rgba(212,169,106,0.85)"/>
                  <circle cx="30" cy="22" r="1" fill="rgba(255,240,180,0.95)"/>
                </svg>
              </div>
            </div>
          </div>
          <!-- title -->
          <div class="book-title">Perception</div>
          <!-- volume badge -->
          <div class="cv-volume-badge">1</div>
          <!-- edition banner -->
          <div class="cv-edition">✦ 2026 ✦</div>
        </li>
        <li></li>
      </ul>
      <ul class="bk-pages">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
      <ul class="bk-hardcover-back">
        <li></li>
        <li></li>
      </ul>
      <ul class="bk-spine">
        <li id="open-btn"><span class="face-spine-title">Perception</span></li>
        <li></li>
      </ul>
    </div>
    
    <!-- ====================================================
    FLAT BOOK (main reading experience)
    ==================================================== -->
    <div id="book-flat">

      <div id="flipbook"></div>

      <div id="nav-bar">
        <div class="nav-center">
          <div class="spread-counter" id="spread-counter">1 / 14</div>
          <div class="dot-indicators" id="dot-indicators"></div>
        </div>
      </div>

    </div>

    <!-- ====================================================
    FINALE — 3D POP-UP BOOK SCENE
    ==================================================== -->
    <div id="finale-3d-scene">

      <!-- Floating confetti — decorative particles in scene background -->
      <div class="f3d-confetti" aria-hidden="true">
        <span class="f3d-dot" style="left:9%;top:22%;width:8px;height:8px;background:#d4a96a;animation-duration:5.2s;animation-delay:0.3s"></span>
        <span class="f3d-dot" style="left:22%;top:14%;width:5px;height:5px;background:#c8922a;animation-duration:4.5s;animation-delay:1.1s"></span>
        <span class="f3d-dot" style="left:38%;top:9%;width:7px;height:7px;background:#6B2D8B;animation-duration:6.1s;animation-delay:0.7s"></span>
        <span class="f3d-dot" style="left:58%;top:11%;width:6px;height:6px;background:#d4a96a;animation-duration:5.6s;animation-delay:1.8s"></span>
        <span class="f3d-dot" style="left:74%;top:17%;width:9px;height:9px;background:#c8922a;animation-duration:4.8s;animation-delay:0.5s"></span>
        <span class="f3d-dot" style="left:88%;top:24%;width:5px;height:5px;background:#e8a028;animation-duration:5.0s;animation-delay:1.4s"></span>
        <span class="f3d-dot" style="left:16%;top:72%;width:6px;height:6px;background:#d4a96a;animation-duration:4.6s;animation-delay:2.0s"></span>
        <span class="f3d-dot" style="left:68%;top:76%;width:8px;height:8px;background:#c8922a;animation-duration:5.8s;animation-delay:0.9s"></span>
        <span class="f3d-dot" style="left:84%;top:66%;width:5px;height:5px;background:#6B2D8B;animation-duration:4.2s;animation-delay:1.6s"></span>
        <span class="f3d-dot f3d-dot-star" style="left:7%;top:46%;font-size:14px;color:#d4a96a;animation-duration:6.0s;animation-delay:2.3s">✦</span>
        <span class="f3d-dot f3d-dot-star" style="left:93%;top:52%;font-size:11px;color:#c8922a;animation-duration:5.0s;animation-delay:1.0s">◆</span>
        <span class="f3d-dot f3d-dot-star" style="left:50%;top:7%;font-size:16px;color:#d4a96a;animation-duration:7.2s;animation-delay:0.2s">✦</span>
        <span class="f3d-dot" style="left:44%;top:78%;width:7px;height:7px;background:#e8a028;animation-duration:5.4s;animation-delay:1.5s"></span>
      </div>

      <div class="f3d-stage">
        <div class="f3d-book" id="f3d-book">

          <div class="f3d-spread">

            <div class="f3d-board f3d-board-l"></div>
            <div class="f3d-board f3d-board-r"></div>

            <!-- ===== LEFT PAGE ===== -->
            <div class="f3d-left-page">
              <div class="f3d-pg-label f3d-pg-label-l">1897 · 1911 · 1967 · 2026</div>

              <!-- SVG standee: Scale of Justice — Jeanne Chauvin -->
              <div class="f3d-pop f3d-svg-standee f3d-svg-law">
                <svg viewBox="0 0 50 72" width="40" height="58" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="25" cy="6" r="3.5" fill="none" stroke="#d4a96a" stroke-width="1.8"/>
                  <line x1="25" y1="9.5" x2="25" y2="66" stroke="#d4a96a" stroke-width="2"/>
                  <line x1="25" y1="9.5" x2="9"  y2="22" stroke="#d4a96a" stroke-width="1.1" opacity="0.45"/>
                  <line x1="25" y1="9.5" x2="41" y2="22" stroke="#d4a96a" stroke-width="1.1" opacity="0.45"/>
                  <line x1="9"  y1="22" x2="41" y2="22" stroke="#d4a96a" stroke-width="2"/>
                  <line x1="13" y1="22" x2="13" y2="38" stroke="#d4a96a" stroke-width="1.4"/>
                  <line x1="37" y1="22" x2="37" y2="38" stroke="#d4a96a" stroke-width="1.4"/>
                  <path d="M5 37 Q13 44 21 37"  fill="none" stroke="#d4a96a" stroke-width="2"/>
                  <path d="M29 37 Q37 44 45 37" fill="none" stroke="#d4a96a" stroke-width="2"/>
                  <line x1="17" y1="66" x2="33" y2="66" stroke="#d4a96a" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <span class="f3d-icon-label">Droit</span>
              </div>

              <!-- Photo standee: Jeanne Chauvin -->
              <div class="f3d-pop f3d-standee f3d-std-1"
                   style="background-image:url('assets/images/bio/Jeanne_Chauvin.jpg')">
                <div class="f3d-std-name">J. Chauvin</div>
              </div>

              <!-- SVG standee: Running figure — Kathrine Switzer -->
              <div class="f3d-pop f3d-svg-standee f3d-svg-run">
                <svg viewBox="0 0 40 72" width="32" height="58" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="24" cy="8" r="6" fill="none" stroke="#d4a96a" stroke-width="2"/>
                  <path d="M23 14 L20 34" stroke="#d4a96a" stroke-width="2.2" stroke-linecap="round"/>
                  <path d="M20 22 L6 17"  stroke="#d4a96a" stroke-width="2"   stroke-linecap="round"/>
                  <path d="M20 22 L32 30" stroke="#d4a96a" stroke-width="2"   stroke-linecap="round"/>
                  <path d="M20 34 L10 55" stroke="#d4a96a" stroke-width="2.2" stroke-linecap="round"/>
                  <path d="M20 34 L30 48" stroke="#d4a96a" stroke-width="2.2" stroke-linecap="round"/>
                  <path d="M10 55 L3 63"  stroke="#d4a96a" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M30 48 L38 54" stroke="#d4a96a" stroke-width="1.8" stroke-linecap="round"/>
                  <text x="3" y="70" font-size="7" fill="#d4a96a" opacity="0.65" font-family="serif" font-style="italic">261</text>
                </svg>
                <span class="f3d-icon-label">Sport</span>
              </div>

              <!-- Photo standee: Kathrine Switzer -->
              <div class="f3d-pop f3d-standee f3d-std-2"
                   style="background-image:url('assets/images/bio/kathrine-switzer1.jpg')">
                <div class="f3d-std-name">K. Switzer</div>
              </div>

              <div class="f3d-gem f3d-g1">✦</div>
              <div class="f3d-gem f3d-g3">◆</div>
              <div class="f3d-page-base"></div>
            </div>

            <!-- ===== RIGHT PAGE ===== -->
            <div class="f3d-right-page">
              <div class="f3d-pg-label f3d-pg-label-r">Grâce à elles. Grâce à nous.</div>

              <!-- Photo standee: Marie Curie -->
              <div class="f3d-pop f3d-standee f3d-std-3"
                   style="background-image:url('assets/images/bio/marie-curie.jpg')">
                <div class="f3d-std-name">M. Curie</div>
              </div>

              <!-- SVG standee: Atom — Marie Curie -->
              <div class="f3d-pop f3d-svg-standee f3d-svg-atom">
                <svg viewBox="0 0 60 64" width="50" height="54" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="30" cy="32" r="5.5" fill="#d4a96a" opacity="0.9"/>
                  <ellipse cx="30" cy="32" rx="26" ry="10" fill="none" stroke="#d4a96a" stroke-width="1.6" opacity="0.85"/>
                  <ellipse cx="30" cy="32" rx="26" ry="10" fill="none" stroke="#d4a96a" stroke-width="1.6" opacity="0.85" transform="rotate(60 30 32)"/>
                  <ellipse cx="30" cy="32" rx="26" ry="10" fill="none" stroke="#d4a96a" stroke-width="1.6" opacity="0.85" transform="rotate(120 30 32)"/>
                  <circle cx="56" cy="32" r="3.5" fill="#c8922a"/>
                  <circle cx="17" cy="11" r="3"   fill="#c8922a"/>
                  <circle cx="17" cy="53" r="3"   fill="#c8922a"/>
                </svg>
                <span class="f3d-icon-label">Sciences</span>
              </div>

              <!-- SVG standee: Microphone — Anne Hathaway -->
              <div class="f3d-pop f3d-svg-standee f3d-svg-mic">
                <svg viewBox="0 0 44 72" width="36" height="58" xmlns="http://www.w3.org/2000/svg">
                  <rect x="15" y="5" width="14" height="24" rx="7" fill="rgba(212,169,106,0.1)" stroke="#d4a96a" stroke-width="2"/>
                  <line x1="22" y1="13" x2="22" y2="22" stroke="#d4a96a" stroke-width="1"   opacity="0.35"/>
                  <line x1="22" y1="16" x2="26" y2="16" stroke="#d4a96a" stroke-width="1"   opacity="0.25"/>
                  <path d="M8 24 Q8 40 22 40 Q36 40 36 24" fill="none" stroke="#d4a96a" stroke-width="2"/>
                  <line x1="22" y1="40" x2="22" y2="60" stroke="#d4a96a" stroke-width="2"/>
                  <line x1="12" y1="60" x2="32" y2="60" stroke="#d4a96a" stroke-width="2.5" stroke-linecap="round"/>
                  <path d="M37 14 Q42 20 37 26" fill="none" stroke="#d4a96a" stroke-width="1.3" opacity="0.6"/>
                  <path d="M40 10 Q48 20 40 30" fill="none" stroke="#d4a96a" stroke-width="1.2" opacity="0.35"/>
                </svg>
                <span class="f3d-icon-label">Voix</span>
              </div>

              <!-- Photo standee: Anne Hathaway -->
              <div class="f3d-pop f3d-standee f3d-std-4"
                   style="background-image:url('assets/images/bio/anne_hathaway.jpg')">
                <div class="f3d-std-name">A. Hathaway</div>
              </div>

              <div class="f3d-gem f3d-g2">✦</div>
              <div class="f3d-gem f3d-g4">◆</div>
              <div class="f3d-page-base"></div>
            </div>
          </div>

          <div class="f3d-spine"></div>

        </div>
      </div>

      <div class="f3d-caption-bar">
        <div class="f3d-quote">Les perceptions évoluent et les réalités continuent de se transformer.</div>
        <button class="f3d-recommencer-btn" id="recommencer-btn">Recommencer</button>
      </div>
    </div>

  </div>
  
  <script src="js/data.js"></script>
  <script src="js/book-intro.js"></script>
  <script src="js/flipbook.js"></script>
  <script src="js/finale.js"></script>
</body>
</html>
